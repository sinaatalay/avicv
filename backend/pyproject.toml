[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for speedhack"
readme = "README.md"
authors = [
    { name = "Sina Atalay", email = "79940989+sinaatalay@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "httpx2>=2.13.1",
    "mcp>=2,<3",
    "pillow>=12.0.0",
    "pydantic-ai-slim[openrouter]>=2.55.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "pypdfium2>=5.0.0",
    "rendercv[full]>=2.8,<2.9",
    "typesafe-sdk>=0.7.4",
]

[project.scripts]
jobs-ingest = "backend.jobs.ingest:main"
avicv-claim-legacy = "backend.migrate_owner:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.fastapi]
entrypoint = "backend.main:app"

[tool.pytest]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I", "UP"]
