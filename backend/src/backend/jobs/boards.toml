# Employer job boards pulled by `jobs-ingest`. Each one was verified live on 2026-10-11:
# HTTP 200, at least one listed job, and postings that name the employer.
#
#   provider  greenhouse | ashby | lever | smartrecruiters
#   id        the board token / company id from the careers page URL (case matters):
#             job-boards.greenhouse.io/{id}, jobs.ashbyhq.com/{id}, jobs.lever.co/{id},
#             jobs.smartrecruiters.com/{id}
#   countries (SmartRecruiters) server-side filter; each posting costs a detail request
#
# Board ids go stale when employers switch ATS: a dead board shows up as `failed` (404)
# or `suspect` (suddenly empty) in ingest_board_runs. SmartRecruiters answers 200 with
# no postings for an unknown id, so check those against the careers page.

